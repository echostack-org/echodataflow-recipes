[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echodataflow-recipes"
version = "0.1.0"
description = "Processing and visualization recipes for Echostack"
requires-python = ">=3.13,<3.15"
dependencies = [
    "echopype==0.12.0",
    "fastapi==0.139.0",
    "echodataflow @ git+https://github.com/echostack-org/echodataflow.git@main",
    "echoshader @ git+https://github.com/echostack-org/echoshader.git@overhaul",
]

[tool.setuptools]
packages = []
