name: Basic recipe

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  basic-recipe:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Echostack packages
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade echopype echoregions echoshader
          pip install git+https://github.com/echostack-org/echodataflow.git@main

      - name: Prepare example data
        run: |
          rm -rf .local/basic
          mkdir -p .local/basic/raw
          mkdir -p .local/basic/main

          curl -L \
            https://noaa-wcsd-pds.s3.amazonaws.com/data/raw/Bell_M._Shimada/SH2306/EK80/Hake-D20230811-T165727.raw \
            -o .local/basic/raw/Hake-D20230811-T165727.raw

      - name: Make configs CI-local
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          root = Path.cwd().resolve()

          params_path = Path("recipes_nrt/basic/params.yaml")
          params = yaml.safe_load(params_path.read_text())

          params["flows"]["raw2Sv"]["path_raw"] = str(root / ".local/basic/raw")
          params["flows"]["raw2Sv"]["path_main"] = str(root / ".local/basic/main")
          params["flows"]["create_MVBS"]["path_main"] = str(root / ".local/basic/main")

          params_path.write_text(yaml.safe_dump(params, sort_keys=False))

          app_path = Path("recipes_nrt/basic/app.yaml")
          app = yaml.safe_load(app_path.read_text())

          app["data"]["mvbs"]["path"] = str(
              root / ".local/basic/main/MVBS/MVBS_20230811T170000.zarr"
          )

          app_path.write_text(yaml.safe_dump(app, sort_keys=False))
          PY

      - name: Start Prefect server
        env:
          PREFECT_API_URL: http://127.0.0.1:4200/api
        run: |
          nohup python -m prefect server start --host 127.0.0.1 --port 4200 \
            > prefect-server.log 2>&1 &

          for i in {1..60}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:4200/api/health >/dev/null; then
              echo "Prefect server ready"
              exit 0
            fi
            sleep 2
          done

          echo "Prefect server failed to start"
          cat prefect-server.log
          exit 1

      - name: Create work pool
        run: |
          prefect work-pool create --type process local || true

      - name: Start Prefect worker
        run: |
          nohup python -m prefect worker start --pool local > prefect-worker.log 2>&1 &
          sleep 5

      - name: Check Prefect API before deployment
        run: |
          curl --fail --show-error http://127.0.0.1:4200/api/health

      - name: Deploy flows
        run: |
          python -m echodataflow.deployment.deploy_cli run \
            --default-work-pool-name local \
            --param-config recipes_nrt/basic/params.yaml \
            --deploy-spec recipes_nrt/basic/deploy.yaml

      - name: Run raw2Sv
        run: |
          prefect deployment run "flow-raw2Sv/raw2Sv-basic" --watch

      - name: Run create_MVBS
        run: |
          OFFSET=$(python - <<'PY'
          from datetime import datetime, timezone

          target = datetime.fromisoformat("2023-08-11T17:06:00+00:00")
          print(int((datetime.now(timezone.utc) - target).total_seconds()))
          PY
          )

          prefect deployment run "flow-create-MVBS/create-MVBS-basic" \
            --param time_offset_seconds=$OFFSET \
            --watch

      - name: Verify MVBS output
        run: |
          test -d .local/basic/main/MVBS/MVBS_20230811T170000.zarr
          ls -la .local/basic/main/MVBS

      - name: Build Echoshader app
        run: |
          python - <<'PY'
          from echoshader.app.config import load_config
          from echoshader.app.builder import build_app

          config = load_config("recipes_nrt/basic/app.yaml")
          app = build_app(config)

          assert app is not None
          print("BUILD OK")
          PY

      - name: Export Echoshader app to HTML
        run: |
          python - <<'PY'
          from pathlib import Path

          from echoshader.app.config import load_config
          from echoshader.app.builder import build_app
          from panel.io.save import save

          root = Path.cwd().resolve()

          local_act_root = Path("/workspace/dev/echodataflow-recipes")

          if local_act_root.exists():
              output_dir = local_act_root / ".local/pages/basic-recipe"
          else:
              output_dir = root / ".local/pages/basic-recipe"

          output_dir.mkdir(parents=True, exist_ok=True)
          output = output_dir / "index.html"

          config = load_config("recipes_nrt/basic/app.yaml")
          app = build_app(config)

          save(
              app,
              output,
              embed=True,
              resources="inline",
          )

          print(f"Saved static app to {output}")
          PY

      - name: Prepare Pages landing page
        run: |
          mkdir -p .local/pages
          cp pages/index.html .local/pages/index.html

      - name: Upload PR preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: basic-recipe-preview
          path: .local/pages/basic-recipe

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .local/pages

      - name: Show Prefect logs on failure
        if: failure()
        run: |
          cat prefect-server.log || true
          cat prefect-worker.log || true

  deploy-pages:
    if: github.event_name == 'push'
    needs: basic-recipe
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
