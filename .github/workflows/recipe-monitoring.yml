name: Test monitoring recipe

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-monitoring:
    runs-on: ubuntu-latest

    env:
      PREFECT_API_URL: http://127.0.0.1:4200/api

    steps:
      - name: Checkout recipes
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Echostack packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check
          python -c "import fastapi, prefect; print('FastAPI:', fastapi.__version__, 'Prefect:', prefect.__version__)"

      - name: Start Prefect server
        run: |
          nohup python -m prefect server start \
            > prefect-server.log 2>&1 < /dev/null &

          echo $! > prefect-server.pid

          ready=false
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4200/api/health > /dev/null; then
              ready=true
              break
            fi

            if ! kill -0 "$(cat prefect-server.pid)" 2>/dev/null; then
              echo "Prefect server exited"
              cat prefect-server.log
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "Prefect server did not become ready"
            cat prefect-server.log
            exit 1
          fi

          echo "Prefect server ready"

      - name: Test monitoring recipe
        timeout-minutes: 3
        shell: python
        run: |
          import asyncio
          import tempfile
          import time
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          import yaml
          from prefect import get_client
          from prefect.events.filters import EventFilter, EventOccurredFilter

          from echodataflow.operations.operations_watchdog import (
              watch_raw_directory,
              watch_transect_file,
          )
          from echodataflow.utils.processing_ledger import (
              get_raw_files_to_process,
              get_transects_to_process,
          )

          recipe = Path("recipes_nrt/monitoring")

          with (recipe / "deploy.yaml").open() as stream:
              deploy = yaml.safe_load(stream)

          with (recipe / "params.yaml").open() as stream:
              params = yaml.safe_load(stream)

          transect_trigger = deploy["flows"]["transect_update"]["triggers"][0]

          raw_params = params["flows"]["raw2Sv"]
          transect_params = params["flows"]["transect_update"]


          async def wait_for_raw(raw_file, db_path, timeout=10):
              deadline = time.time() + timeout

              while time.time() < deadline:
                  files = get_raw_files_to_process(db_path)

                  if raw_file.resolve() in [
                      path.resolve() for path in files
                  ]:
                      return

                  await asyncio.sleep(0.5)

              raise AssertionError(
                  f"RAW file was not registered: {raw_file}"
              )


          async def wait_for_transect(db_path, timeout=10):
              deadline = time.time() + timeout

              while time.time() < deadline:
                  transects = get_transects_to_process(db_path)

                  if transects:
                      return

                  await asyncio.sleep(0.5)

              raise AssertionError(
                  "Transect was not registered"
              )


          async def has_event(event_name):
              async with get_client() as client:
                  now = datetime.now(timezone.utc)

                  page = await client.read_events(
                      filter=EventFilter(
                          occurred=EventOccurredFilter(
                              since=now - timedelta(minutes=5),
                              until=now,
                          )
                      ),
                      limit=50,
                  )

                  return any(
                      event.event == event_name
                      for event in page.events
                  )


          async def wait_for_event(event_name, timeout=10):
              deadline = time.time() + timeout

              while time.time() < deadline:
                  if await asyncio.wait_for(has_event(event_name), timeout=5):
                      return

                  await asyncio.sleep(0.5)

              raise AssertionError(
                  f"Did not receive expected Prefect event: {event_name}"
              )


          async def main():
              with tempfile.TemporaryDirectory() as tmp:
                  root = Path(tmp)
                  db_path = root / "monitoring.db"

                  # raw monitoring
                  raw_dir = root / "raw"
                  raw_dir.mkdir()

                  observer = watch_raw_directory(
                      raw_dir,
                      db_path,
                  )

                  try:
                      pattern = raw_params["filename_pattern"]
                      suffix = pattern.removeprefix("*")
                      raw_file = raw_dir / f"test{suffix}"

                      raw_file.write_bytes(b"dummy raw data")

                      await wait_for_raw(
                          raw_file,
                          db_path,
                      )
                  finally:
                      observer.stop()
                      observer.join()

                  # transect monitoring
                  transect_file = root / Path(
                      transect_params["path_transect_csv"]
                  ).name

                  transect_file.write_text(
                      "transectPart,transectNumber,transectStart,transectEnd\n"
                      "1,1,2024-06-25T21:45:00+00:00,\n"
                  )

                  observer = watch_transect_file(
                      transect_file,
                      db_path,
                  )

                  try:
                      transect_file.write_text(
                          "transectPart,transectNumber,transectStart,transectEnd\n"
                          "1,1,2024-06-25T21:45:00+00:00,"
                          "2024-06-25T21:50:00+00:00\n"
                      )

                      await wait_for_transect(db_path)

                      await wait_for_event(
                          transect_trigger["expect"]
                      )
                  finally:
                      observer.stop()
                      observer.join()


          asyncio.run(asyncio.wait_for(main(), timeout=60))

          print("Monitoring recipe completed successfully.")

      - name: Show Prefect server log on failure
        if: failure()
        run: cat prefect-server.log || true