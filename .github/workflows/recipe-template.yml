name: Acoustic template recipe

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PREFECT_API_URL: http://127.0.0.1:4200/api

jobs:
  acoustic-template:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Echostack packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check
          python -c "import fastapi, prefect; print('FastAPI:', fastapi.__version__, 'Prefect:', prefect.__version__)"

      - name: Prepare example data
        run: |
          rm -rf .local/template
          mkdir -p .local/template/raw
          mkdir -p .local/template/main

          BASE_URL="https://noaa-wcsd-pds.s3.amazonaws.com/data/raw/Bell_M._Shimada/SH2306/EK80"

          for file in \
            Hake-D20230811-T164746.raw \
            Hake-D20230811-T165727.raw \
            Hake-D20230811-T170531.raw \
            Hake-D20230811-T171237.raw
          do
            curl --fail --location --retry 3 \
              "$BASE_URL/$file" \
              -o ".local/template/raw/$file"
          done

          echo "Downloaded raw files:"
          ls -lh .local/template/raw/

          test "$(find .local/template/raw -maxdepth 1 -name '*.raw' | wc -l)" -eq 4

      - name: Make configs CI-local
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          root = Path.cwd().resolve()

          params_path = Path("recipes_nrt/template/params.yaml")
          params = yaml.safe_load(params_path.read_text())

          params["flows"]["raw2Sv"]["path_raw"] = str(root / ".local/template/raw")
          params["flows"]["raw2Sv"]["path_main"] = str(root / ".local/template/main")
          params["flows"]["create_MVBS"]["path_main"] = str(root / ".local/template/main")

          params_path.write_text(yaml.safe_dump(params, sort_keys=False))

          app_path = Path("recipes_nrt/template/acoustic_template.yaml")
          app = yaml.safe_load(app_path.read_text())

          app["data"][app["app"].get("source", "survey")]["path"] = str(
              root / ".local/template/main/MVBS/MVBS_20230811T164000.zarr"
          )

          app_path.write_text(yaml.safe_dump(app, sort_keys=False))
          PY

      - name: Start Prefect server
        run: |
          nohup python -m prefect server start \
            > prefect-server.log 2>&1 < /dev/null &

          echo $! > prefect-server.pid

          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4200/api/health > /dev/null; then
              echo "Prefect server ready"
              break
            fi

            if ! kill -0 "$(cat prefect-server.pid)" 2>/dev/null; then
              echo "Prefect server exited"
              cat prefect-server.log
              exit 1
            fi

            sleep 2
          done

          curl --fail http://127.0.0.1:4200/api/health

      - name: Create work pool
        run: |
          prefect work-pool create --type process local

      - name: Start Prefect worker
        run: |
          nohup python -m prefect worker start --pool local \
            > prefect-worker.log 2>&1 < /dev/null &

          echo $! > prefect-worker.pid
          sleep 5

      - name: Check Prefect connection
        run: |
          echo "PREFECT_API_URL=$PREFECT_API_URL"
          curl --fail --show-error http://127.0.0.1:4200/api/health

      - name: Deploy flows
        run: |
          python -m echodataflow.deployment.deploy_cli run \
            --default-work-pool-name local \
            --param-config recipes_nrt/template/params.yaml \
            --deploy-spec recipes_nrt/template/deploy.yaml

      - name: Run raw2Sv
        run: |
          prefect deployment run "flow-raw2Sv/raw2Sv-template" --watch

      - name: Run create_MVBS
        run: |
          OFFSET=$(python - <<'PY'
          from datetime import datetime, timezone

          target = datetime.fromisoformat("2023-08-11T17:20:00+00:00")
          print(int((datetime.now(timezone.utc) - target).total_seconds()))
          PY
          )

          prefect deployment run "flow-create-MVBS/create-MVBS-template" \
            --param time_offset_seconds=$OFFSET \
            --watch

      - name: Verify MVBS output
        run: |
          test -d .local/template/main/MVBS/MVBS_20230811T164000.zarr
          ls -la .local/template/main/MVBS

      - name: Build Echoshader app
        run: |
          python - <<'PY'
          from echoshader.app.config import load_config
          from echoshader.app.builder import build_app

          config = load_config("recipes_nrt/template/acoustic_template.yaml")
          app = build_app(config)

          assert app is not None
          print("BUILD OK")
          PY

      - name: Export Echoshader app to HTML
        run: |
          python - <<'PY'
          from pathlib import Path

          from echoshader.app.config import load_config
          from echoshader.app.builder import build_app
          from panel.io.save import save

          root = Path.cwd().resolve()

          local_act_root = Path("/workspace/dev/echodataflow-recipes")

          if local_act_root.exists():
              output_dir = local_act_root / ".local/pages/acoustic-template"
          else:
              output_dir = root / ".local/pages/acoustic-template"

          output_dir.mkdir(parents=True, exist_ok=True)
          output = output_dir / "index.html"

          config = load_config("recipes_nrt/template/acoustic_template.yaml")
          app = build_app(config)

          # Static HTML export is a snapshot; server-side Panel callbacks require a live server.
          save(
              app,
              output,
              embed=True,
              resources="inline",
          )

          assert output.is_file() and output.stat().st_size > 0
          print(f"Saved static app to {output}")
          PY

      - name: Prepare Pages landing page
        run: |
          mkdir -p .local/pages
          cp pages/index.html .local/pages/index.html

      - name: Upload PR preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: acoustic-template-preview
          path: .local/pages/acoustic-template

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .local/pages

      - name: Show Prefect logs on failure
        if: failure()
        run: |
          cat prefect-server.log || true
          cat prefect-worker.log || true

  deploy-pages:
    if: github.event_name == 'push'
    needs: acoustic-template
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

