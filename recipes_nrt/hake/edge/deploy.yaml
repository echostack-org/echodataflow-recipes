flow_start_time: # use ISO8601 format: if UTC use +00:00 or Z

source:
  mode: local

default_work_pool_name: edge-local

flows:
  raw2Sv:
    deployment_name: raw2Sv
    deployment_concurrency:
      limit: 1
      collision_strategy: CANCEL_NEW
    interval: 5

  create_MVBS:
    deployment_name: create-MVBS
    interval: 10
    cron_offset: 3

  predict_hake:
    deployment_name: predict-hake
    interval: 20

  file_upload_acoustics:
    deployment_name: file-upload-acoustics
    flow: file_upload
    interval: 10
    cron_offset: 3

  file_upload_trawl:
    deployment_name: file-upload-trawl
    flow: file_upload
    interval: 10
