flows:
  raw2Sv:
    exclude_before: '2024-08-09T00:00:00+00:00'
    exclude_raw_file: []
    parallel: false
    new_file_num_limit: 10
    encode_mode: power
    waveform_mode: CW
    depth_offset: 7
    sonar_model: EK80
    datagram_type: null
    nmea_sentence: GGA
    add_depth: true
    add_location: true
    add_splitbeam_angle: true
    filename_pattern: '*.raw'
    path_raw: D:/echodataflow_data/sh2407_north_test/raw_selected
    path_main: D:/echodataflow_data/sh2407_north_test
    file_Sv_csv: Sv_files.csv
  process_Sv_CPS:
    exclude_before: '2024-08-09T00:00:00+00:00'
    path_main: D:/echodataflow_data/sh2407_north_test
    file_Sv_csv: Sv_files.csv
    processing_db: processing.db
    new_file_num_limit: 10
    target_frequency: 70000
    min_depth: 10
    seafloor_threshold:
    - -40
    - 2.4
    - 1.0
    seafloor_offset: 0.5
    seafloor_r0: 10
    seafloor_r1: 1000
    seafloor_wtheta: 28
    seafloor_wphi: 52
    mask_mode: cps
    fallback_sv_threshold: -70
  process_transect_CPS:
    exclude_before: '2024-08-09T00:00:00+00:00'
    path_transect_csv: D:/echodataflow_data/sh2407_north_test/plotSurvey_Survey_Data_Visualizer.csv
    path_snapshot_csv: D:/echodataflow_data/sh2407_north_test/plotSurvey_Survey_Data_Visualizer_snapshot.csv
    path_main: D:/echodataflow_data/sh2407_north_test
    processing_db: processing.db
    range_bin: 10m
    dist_bin: 0.5nmi
  update_cache_CPS:
    path_CPS: D:/echodataflow_data/sh2407_north_test/CPS_Sv
    path_cache: D:/echodataflow_data/sh2407_north_test/viz_cache_CPS
    processing_db: processing.db
    file_CPS_zarr: latest_CPS.zarr
