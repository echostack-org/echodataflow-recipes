source:
  mode: local
default_work_pool_name: local
flows:
  copy_raw:
    deployment_name: template-cps-copy-raw
    interval: 3
    deployment_concurrency:
      limit: 1
      collision_strategy: CANCEL_NEW
  raw2Sv:
    deployment_name: template-cps-raw2Sv
    interval: 3
    deployment_concurrency:
      limit: 1
      collision_strategy: CANCEL_NEW
  process_Sv_CPS:
    deployment_name: template-cps-process-Sv-CPS
    interval: 5
    deployment_concurrency:
      limit: 1
      collision_strategy: CANCEL_NEW
  process_transect_CPS:
    deployment_name: template-cps-process-transect-CPS
    interval: 5
    deployment_concurrency:
      limit: 1
      collision_strategy: CANCEL_NEW
  update_cache_CPS:
    deployment_name: template-cps-update-cache-CPS
    interval: 1
    deployment_concurrency:
      limit: 1
      collision_strategy: CANCEL_NEW
