app:
  title: SH2407 North — 10 transects of 30 minutes
  route: cps-north
  port: 1805
  source: survey

data:
  survey:
    type: zarr
    path: ${ECHODATAFLOW_CPS_ROOT}/viz_cache_CPS/latest_CPS.zarr
    label: Latest completed transect

display:
  variables:
  - Sv
  - Sv_water_column
  - Sv_masked
  max_range_samples: 160
navigation:
  max_pings: 400

extensions:
  recent_transects:
    factory: echodataflow.services.cps_app_transect:build_tabs
    root: ${ECHODATAFLOW_CPS_ROOT}
    processing_db: processing.db
    count: 10
    vert_dim: depth
    xlim:
    - -125.0
    - -124.25
    requires_source: false
    
file_catalogue:
  factory: echodataflow.services.cps_app_transect:build_files
  root: ${ECHODATAFLOW_CPS_ROOT}
  processing_db: processing.db
