flows:
  ingest_haul:
    path_vm_local: ../../echodataflow-recipes/recipes_nrt/edge2cloud_hake/cloud/data  # path to local integrated data
    path_bio_files: remote:bucket/path/to/dir  # rclone format
    file_haul_info_all: haul_info_all.csv
    file_specimen_all: specimen_all.csv
    file_length_all: length_all.csv
    file_length_count_all: length_count_all.csv
    file_stratum_mean: stratum_mean.csv
    path_stratum_def: ../../echodataflow-recipes/recipes_nrt/edge2cloud_hake/cloud/resources/inpfc_def.csv

  ingest_NASC:
    path_vm_local: ../../echodataflow-recipes/recipes_nrt/edge2cloud_hake/cloud/data # path to local integrated data
    path_NASC_files: remote:bucket/path/to/dir  # rclone format
    file_NASC_all: NASC_all.csv
    file_stratum_mean: stratum_mean.csv
    file_NASC_all_grid: NASC_all_griddify.geojson
    num_NASC_reprocess: 5
    new_file_num_limit: 200

  update_grid:
    path_vm_local: ../../echodataflow-recipes/recipes_nrt/edge2cloud_hake/cloud/data # path to local integrated data
    file_NASC_all_grid: NASC_all_griddify.geojson
    file_stratum_mean: stratum_mean.csv

  update_cache_MVBS:
    slice_mins: 180
    path_cache: ../../echodataflow-recipes/recipes_nrt/edge2cloud_hake/cloud/data/viz_cache_MVBS
    path_MVBS: remote:bucket/path/to/dir  # rclone format
    file_MVBS_csv: MVBS_files.csv
    file_MVBS_zarr: latest_MVBS.zarr
